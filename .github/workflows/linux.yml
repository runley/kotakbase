# Builds the Linux AppImage on a Linux machine (native modules must be installed for Linux) and attaches it, with
# latest-linux.yml for the auto-updater, to the release. Runs when a release is published, or by hand for a tag.
name: Linux build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v0.1.0-beta.13)
        required: true

permissions:
  contents: write # upload to the release

jobs:
  appimage:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the client ids go into the build like on Windows (secrets.local.json, git-ignored); missing ones only turn that feature off
      - name: Write secrets.local.json
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: node -e "require('fs').writeFileSync('secrets.local.json', JSON.stringify({ malClientId: process.env.MAL_CLIENT_ID, anilistClientId: process.env.ANILIST_CLIENT_ID, discordClientId: process.env.DISCORD_CLIENT_ID }))"
      - run: node scripts/vendor.mjs && node scripts/notices.mjs
      - run: npx electron-builder --linux AppImage --publish never
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.AppImage dist/latest-linux.yml --clobber
