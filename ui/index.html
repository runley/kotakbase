<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; img-src * data: blob:; media-src * blob:; connect-src * 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' blob: https://esm.sh 'wasm-unsafe-eval'; worker-src 'self' blob:">
  <title>Kotakbase</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/" aria-label="Kotakbase home"><span class="logo-box" aria-hidden="true">k</span><span class="logo-word">kotak<span>base</span></span></a>
    <nav class="tabs" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/schedule" data-nav="schedule">Schedule</a>
      <a href="#/history" data-nav="history">History</a>
      <a href="#/extensions" data-nav="extensions">Extensions</a>
      <a href="#/together" data-nav="together">Watch Together</a>
    </nav>
    <a class="top-search" href="#/search" data-nav="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Search anime</span></a>
    <a class="top-dl" href="#/downloads" data-nav="downloads" aria-label="Downloads" title="Downloads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span id="dl-pill"></span></a>
    <a class="top-icon" href="#/settings" data-nav="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </header>
  <main id="app"></main>
  <div id="player" hidden>
    <div id="player-video"></div>
    <button class="p-mini-close" data-p="close" aria-label="Close player">✕</button>
    <button class="p-skip" id="p-skip" data-p="skip" hidden></button>
    <div class="p-ui">
      <button class="p-btn p-back" data-p="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="p-stats">
        <span><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.8-1.7-5-4-5.7"/></svg><b id="p-peers">0</b></span>
        <span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><b id="p-down">0 kb/s</b></span>
        <span><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg><b id="p-up">0 kb/s</b></span>
      </div>
      <div class="p-room" id="p-room" hidden>
        <button class="p-room-badge" data-p="say" title="Message the room"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19.5a6.5 6.5 0 0 1 13 0M16 4.8a3.5 3.5 0 0 1 0 6.4M18 13.5a6.5 6.5 0 0 1 3.5 6"/></svg><span id="p-room-text"></span></button>
        <form class="p-say" id="p-say" hidden><input maxlength="300" placeholder="Message the room, Enter to send" aria-label="Message the room" autocomplete="off"></form>
        <div class="p-chat" id="p-chat" aria-live="polite"></div>
      </div>
      <div class="p-loading" id="p-loading"></div>
      <div class="p-bottom">
        <div class="p-info">
          <div><button class="p-link" id="p-title" data-p="title" title="Open the show's page"></button><button class="p-link p-sub" id="p-ep" data-p="episodes" title="Episodes"></button></div>
          <div class="p-sub p-time" id="p-time">0:00 / 0:00</div>
        </div>
        <div class="p-seek" id="p-seek" role="slider" aria-label="Seek" tabindex="0">
          <div class="p-chapters" id="p-chapters"></div><div class="p-buf" id="p-buf"></div><div class="p-played" id="p-played"></div><div class="p-hover" id="p-hover"></div>
        </div>
        <div class="p-row">
          <button class="p-btn" data-p="play" aria-label="Play/Pause"><svg viewBox="0 0 24 24" id="p-play-icon"><path d="M7 4.5v15l12-7.5z" class="fill"/></svg></button>
          <button class="p-btn" data-p="prev" aria-label="Previous episode"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5 9 12l9 7z" class="fill"/></svg></button>
          <button class="p-btn" data-p="next" aria-label="Next episode"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7z" class="fill"/></svg></button>
          <div class="p-vol">
            <button class="p-btn" data-p="mute" aria-label="Mute"><svg viewBox="0 0 24 24" id="p-vol-icon"><path d="M4 9h4l5-4v14l-5-4H4z" class="fill"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
            <input type="range" id="p-volume" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          </div>
          <span class="grow"></span>
          <div class="p-menu-wrap">
            <button class="p-btn" data-p="subs" aria-label="Subtitles"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 13h4M13 13h4M7 16h6"/></svg></button>
            <div class="p-menu" id="p-subs" hidden></div>
          </div>
          <button class="p-btn" data-p="fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
