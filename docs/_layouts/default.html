<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: 'Kotakbase' }}</title>
<meta name="theme-color" content="#C8F04A">
<link rel="icon" href="{{ '/icon.png' | relative_url }}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/site.css' | relative_url }}">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}"><span class="logo-box" aria-hidden="true">k</span><span>kotak<span>base</span></span></a>
    <nav class="tabs" aria-label="Site">
      <a class="wide" href="{{ '/#features' | relative_url }}">Features</a>
      <a href="{{ '/#download' | relative_url }}">Download</a>
      <a href="https://github.com/runley/kotakbase">GitHub</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <article class="doc">
{{ content }}
  </article>
</main>
<footer>
  <div class="wrap">
    <nav aria-label="Legal">
      <a href="{{ '/terms' | relative_url }}">Terms of Service</a>
      <a href="{{ '/privacy' | relative_url }}">Privacy Policy</a>
      <a href="{{ '/code-signing' | relative_url }}">Code Signing Policy</a>
      <a href="https://github.com/runley/kotakbase/issues">Report a problem</a>
    </nav>
  </div>
</footer>
</body>
</html>
